<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prepskm - JEE & NEET Study Platform</title>

  <!-- Intercept and suppress harmless HMR WebSocket disconnect errors in proxy/iframe environment -->
  <script>
    window.addEventListener('error', function(event) {
      if (
        (event.filename && event.filename.includes('@vite/client')) ||
        (event.message && (
          event.message.includes('WebSocket') ||
          event.message.includes('vite') ||
          event.message.includes('HMR')
        ))
      ) {
        event.preventDefault();
        event.stopImmediatePropagation();
        return true;
      }
    }, true);

    window.addEventListener('unhandledrejection', function(event) {
      var reasonStr = String(event.reason || '');
      var stackStr = String(event.reason && event.reason.stack || '');
      if (
        reasonStr.includes('WebSocket') ||
        reasonStr.includes('vite') ||
        stackStr.includes('@vite/client')
      ) {
        event.preventDefault();
        event.stopImmediatePropagation();
      }
    }, true);
  </script>
  <meta name="description" content="Distraction-free educational platform by @unfiltereddsumit with NTA-style CBT mock test engine, chapter-wise notes, formula sheets, backlog destroyer, 1:1 mentorship passes, and Prep AI doubt tutor." />
  <meta property="og:title" content="Prepskm - JEE & NEET Study Platform" />

  <!-- Immediate Theme Initialization Script (Avoids flash of wrong theme) -->
  <script>
    (function() {
      try {
        const theme = localStorage.getItem('prepskm_theme_mode') || 'dark';
        const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      } catch (e) {}
    })();
  </script>
